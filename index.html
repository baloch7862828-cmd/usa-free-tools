<!DOCTYPE html>
<html>
<head>
  <title>USA Free Tools</title>
</head>

<body>
  <h1>USA Free Tools</h1>
  <p>Free online tools for everyone.</p>

  <hr>

  <h2>Percentage Calculator</h2>

  <input type="number" id="number" placeholder="Enter number">
  <input type="number" id="percent" placeholder="Enter percentage">

  <button onclick="calculate()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculate() {
      let number = document.getElementById("number").value;
      let percent = document.getElementById("percent").value;

      let result = (number * percent) / 100;

      document.getElementById("result").innerText =
        "Result: " + result;
    }
  </script>
<hr>

<h2>Age Calculator</h2>

<input type="date" id="birthDate">

<button onclick="calculateAge()">Calculate Age</button>

<p id="ageResult"></p>

<script>
  function calculateAge() {
    let birthDate = new Date(document.getElementById("birthDate").value);
    let today = new Date();

    let age = today.getFullYear() - birthDate.getFullYear();

    let month = today.getMonth() - birthDate.getMonth();

    if (
      month < 0 ||
      (month === 0 && today.getDate() < birthDate.getDate())
    ) {
      age--;
    }

    document.getElementById("ageResult").innerText =
      "Your age is: " + age + " years";
  }
</script>
  <hr>

<h2>Tip Calculator</h2>

<input type="number" id="bill" placeholder="Bill amount ($)">

<input type="number" id="tip" placeholder="Tip percentage (%)">

<button onclick="calculateTip()">Calculate Tip</button>

<p id="tipResult"></p>

<script>
function calculateTip() {
  let bill = parseFloat(document.getElementById("bill").value);
  let tip = parseFloat(document.getElementById("tip").value);

  if (isNaN(bill) || isNaN(tip)) {
    document.getElementById("tipResult").innerText =
      "Please enter both amounts.";
    return;
  }

  let tipAmount = (bill * tip) / 100;
  let total = bill + tipAmount;

  document.getElementById("tipResult").innerText =
    "Tip: $" + tipAmount.toFixed(2) +
    " | Total: $" + total.toFixed(2);
}
</script>
  <hr>

<h2>Word Counter</h2>

<textarea id="textInput" rows="8" cols="40"
placeholder="Type or paste your text here..."></textarea>

<br><br>

<button onclick="countWords()">Count Words</button>

<p id="wordResult"></p>

<script>
function countWords() {
  let text = document.getElementById("textInput").value.trim();

  let words = text === "" ? 0 : text.split(/\s+/).length;
  let characters = text.length;

  document.getElementById("wordResult").innerText =
    "Words: " + words + " | Characters: " + characters;
}
</script>
  <hr>

<h2>Image Resizer</h2>

<input type="file" id="imageInput" accept="image/*">

<br><br>

<label>Width:</label>
<input type="number" id="width" placeholder="Width">

<br><br>

<label>Height:</label>
<input type="number" id="height" placeholder="Height">

<br><br>

<button onclick="resizeImage()">Resize Image</button>

<br><br>

<canvas id="canvas" style="max-width:100%;"></canvas>

<br><br>

<a id="downloadLink" style="display:none;" download="resized-image.png">
  Download Resized Image
</a>

<script>
function resizeImage() {
  let file = document.getElementById("imageInput").files[0];
  let width = parseInt(document.getElementById("width").value);
  let height = parseInt(document.getElementById("height").value);

  if (!file || !width || !height) {
    alert("Please select an image and enter width and height.");
    return;
  }

  let img = new Image();
  let reader = new FileReader();

  reader.onload = function(e) {
    img.onload = function() {
      let canvas = document.getElementById("canvas");
      let ctx = canvas.getContext("2d");

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(img, 0, 0, width, height);

      let downloadLink = document.getElementById("downloadLink");
      downloadLink.href = canvas.toDataURL("image/png");
      downloadLink.style.display = "inline";
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
}
</script>
  <hr>

<h2>Discount Calculator</h2>

<input type="number" id="price" placeholder="Original price ($)">

<input type="number" id="discount" placeholder="Discount (%)">

<button onclick="calculateDiscount()">Calculate Discount</button>

<p id="discountResult"></p>

<script>
function calculateDiscount() {
  let price = parseFloat(document.getElementById("price").value);
  let discount = parseFloat(document.getElementById("discount").value);

  if (isNaN(price) || isNaN(discount)) {
    document.getElementById("discountResult").innerText =
      "Please enter price and discount.";
    return;
  }

  let saved = (price * discount) / 100;
  let finalPrice = price - saved;

  document.getElementById("discountResult").innerText =
    "You save: $" + saved.toFixed(2) +
    " | Final price: $" + finalPrice.toFixed(2);
}
</script>
  <hr>

<h2>Length Converter</h2>

<input type="number" id="meters" placeholder="Enter meters">

<button onclick="convertLength()">Convert</button>

<p id="lengthResult"></p>

<script>
function convertLength() {
  let meters = parseFloat(document.getElementById("meters").value);

  if (isNaN(meters)) {
    document.getElementById("lengthResult").innerText =
      "Please enter a number.";
    return;
  }

  let feet = meters * 3.28084;
  let inches = meters * 39.3701;

  document.getElementById("lengthResult").innerText =
    "Feet: " + feet.toFixed(2) +
    " | Inches: " + inches.toFixed(2);
}
</script>
  <hr>

<h2>USD to PKR Converter</h2>

<input type="number" id="usd" placeholder="Enter USD">

<button onclick="convertCurrency()">Convert</button>

<p id="currencyResult"></p>

<script>
function convertCurrency() {
  let usd = parseFloat(document.getElementById("usd").value);
  let rate = 280;

  if (isNaN(usd)) {
    document.getElementById("currencyResult").innerText =
      "Please enter an amount.";
    return;
  }

  let pkr = usd * rate;

  document.getElementById("currencyResult").innerText =
    "$" + usd.toFixed(2) + " = Rs. " + pkr.toFixed(2);
}
</script>
</body>
</html>
