<!DOCTYPE html>
<html>
<head>
  <title>USA Free Tools</title>
</head>

<body>
  <h1>USA Free Tools</h1>
  <p>Free online tools for everyone.</p>

  <hr>

  <h2>Percentage Calculator</h2>

  <input type="number" id="number" placeholder="Enter number">
  <input type="number" id="percent" placeholder="Enter percentage">

  <button onclick="calculate()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculate() {
      let number = document.getElementById("number").value;
      let percent = document.getElementById("percent").value;

      let result = (number * percent) / 100;

      document.getElementById("result").innerText =
        "Result: " + result;
    }
  </script>
<hr>

<h2>Age Calculator</h2>

<input type="date" id="birthDate">

<button onclick="calculateAge()">Calculate Age</button>

<p id="ageResult"></p>

<script>
  function calculateAge() {
    let birthDate = new Date(document.getElementById("birthDate").value);
    let today = new Date();

    let age = today.getFullYear() - birthDate.getFullYear();

    let month = today.getMonth() - birthDate.getMonth();

    if (
      month < 0 ||
      (month === 0 && today.getDate() < birthDate.getDate())
    ) {
      age--;
    }

    document.getElementById("ageResult").innerText =
      "Your age is: " + age + " years";
  }
</script>
  <hr>

<h2>Tip Calculator</h2>

<input type="number" id="bill" placeholder="Bill amount ($)">

<input type="number" id="tip" placeholder="Tip percentage (%)">

<button onclick="calculateTip()">Calculate Tip</button>

<p id="tipResult"></p>

<script>
function calculateTip() {
  let bill = parseFloat(document.getElementById("bill").value);
  let tip = parseFloat(document.getElementById("tip").value);

  if (isNaN(bill) || isNaN(tip)) {
    document.getElementById("tipResult").innerText =
      "Please enter both amounts.";
    return;
  }

  let tipAmount = (bill * tip) / 100;
  let total = bill + tipAmount;

  document.getElementById("tipResult").innerText =
    "Tip: $" + tipAmount.toFixed(2) +
    " | Total: $" + total.toFixed(2);
}
</script>
  <hr>

<h2>Word Counter</h2>

<textarea id="textInput" rows="8" cols="40"
placeholder="Type or paste your text here..."></textarea>

<br><br>

<button onclick="countWords()">Count Words</button>

<p id="wordResult"></p>

<script>
function countWords() {
  let text = document.getElementById("textInput").value.trim();

  let words = text === "" ? 0 : text.split(/\s+/).length;
  let characters = text.length;

  document.getElementById("wordResult").innerText =
    "Words: " + words + " | Characters: " + characters;
}
</script>
</body>
</html>
